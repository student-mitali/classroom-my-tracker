<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom clone with Hidden Deadlines</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--sf:#fff;--tx:#1f1f1f;--mu:#5f6368;--ln:#dadce0;--ac:#0b57d0;--acbg:#e8f0fe;--pill:#d3e3fd;--wn:#b06000;--wnbg:#fef7e0;--ok:#137333;--okbg:#e6f4ea;--rd:#c5221f;--rdbg:#fce8e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131314;--sf:#1e1f20;--tx:#e3e3e3;--mu:#a8abb0;--ln:#444746;--ac:#a8c7fa;--acbg:#1f3050;--pill:#0842a0;--wn:#fdd663;--wnbg:#3b3320;--ok:#81c995;--okbg:#1e3325;--rd:#f28b82;--rdbg:#3c2321;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131314;--sf:#1e1f20;--tx:#e3e3e3;--mu:#a8abb0;--ln:#444746;--ac:#a8c7fa;--acbg:#1f3050;--pill:#0842a0;--wn:#fdd663;--wnbg:#3b3320;--ok:#81c995;--okbg:#1e3325;--rd:#f28b82;--rdbg:#3c2321;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 380px at 8% -8%,rgba(26,115,232,.14),transparent),radial-gradient(800px 360px at 100% 0,rgba(161,66,244,.12),transparent),var(--bg);color:var(--tx);font:14px/1.5 Roboto,"Google Sans",system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.demo{background:var(--acbg);padding:6px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--mu)}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:none;color:var(--mu);padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--sf);font-weight:500}
header{height:64px;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 16px}
.mark{width:28px;height:28px;border-radius:6px;background:#0f9d58;display:grid;place-items:center;color:#fff;font-size:15px}
.crumb{font-size:22px;color:var(--mu);display:flex;align-items:center;gap:10px;min-width:0}
.crumb b{font-weight:400;color:var(--tx)}
.crumb small{display:block;font-size:12px;color:var(--mu)}
.av{width:32px;height:32px;border-radius:50%;background:#7b5ea7;color:#fff;display:grid;place-items:center;font-size:14px;flex:none;margin-left:auto}
.layout{display:grid;grid-template-columns:256px 1fr}
.side{padding:12px 12px 8px 8px;min-height:calc(100vh - 100px)}
.si{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;text-align:left;padding:0 16px;height:44px;border-radius:24px;margin-bottom:2px;font-size:14px}
.si:hover{background:var(--acbg)}
.si[aria-current="page"]{background:var(--pill);font-weight:500}
.si[aria-disabled="true"]{color:var(--mu);cursor:default}
.si .c{width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.sh{padding:16px 16px 6px;color:var(--mu);font-size:13px;margin-top:8px}
main{padding:0 24px 40px;max-width:980px;width:100%}
.tabs{display:flex;justify-content:center;border-bottom:1px solid var(--ln);margin:0 -24px 20px}
.tabs button{border:0;background:none;padding:0 20px;height:48px;color:var(--mu);border-bottom:3px solid transparent;font-weight:500}
.tabs button[aria-current="true"]{color:var(--ac);border-color:var(--ac)}
.tabs button:disabled{opacity:.6;cursor:default}
.banner{height:250px;border-radius:24px;position:relative;overflow:hidden;color:#fff;box-shadow:0 8px 24px -10px var(--c);background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.3),transparent 42%),linear-gradient(120deg,var(--c),var(--d))}
.banner::before{content:"";position:absolute;right:70px;top:34px;width:130px;height:170px;background:#fbbc04;border-radius:16px;transform:rotate(8deg);box-shadow:34px 22px 0 -6px #a8c7fa,-70px 80px 0 -50px rgba(255,255,255,.4)}
.banner::after{content:"";position:absolute;right:190px;top:96px;width:46px;height:46px;border-radius:50%;border:8px solid #fff;opacity:.85}
.banner h2{position:absolute;left:28px;bottom:42px;margin:0;font-size:40px;font-weight:400;letter-spacing:-.01em}
.banner p{position:absolute;left:28px;bottom:18px;margin:0;font-size:15px;opacity:.92}
.two{display:grid;grid-template-columns:176px 1fr;gap:20px;margin-top:20px;align-items:start}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(60,64,67,.1)}
.box h4{margin:0 0 8px;font-weight:500;font-size:14px}
.code{color:var(--ac);font-size:22px;letter-spacing:.06em;margin:8px 0 0}
.up{font-size:13px;color:var(--mu)}.up .it{margin:8px 0;color:var(--tx)}
.link{border:0;background:none;color:var(--ac);float:right;padding:6px 0;font-weight:500}
.ann{display:flex;align-items:center;gap:14px;color:var(--mu)}
.ph{width:40px;height:40px;border-radius:50%;background:var(--c,#7b5ea7);color:#fff;display:grid;place-items:center;flex:none}
.ph.sq{border-radius:50%;background:var(--ac)}
.meta{font-size:13px;color:var(--mu)}.name{font-weight:500;color:var(--tx);font-size:14px}
.post{display:grid;grid-template-columns:40px 1fr;gap:14px}
.post p{margin:6px 0 0}
.chip{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:500;background:rgba(124,77,255,.14);color:var(--ac)}.chip.ok{background:var(--okbg);color:var(--ok)}
.nudge{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--wnbg);font-size:13.5px}.nudge b{color:var(--wn)}
.btn{border:1px solid var(--ln);background:var(--sf);color:var(--ac);border-radius:18px;padding:6px 14px;font-weight:500;font-size:13px}
.btn.pri{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.cc{border:1px solid var(--ln);border-radius:20px;overflow:hidden;background:var(--sf);text-align:left;padding:0;width:100%;display:block;box-shadow:0 1px 3px rgba(60,64,67,.1);transition:transform .15s,box-shadow .15s}.cc:hover{transform:translateY(-3px);box-shadow:0 10px 22px -10px rgba(60,64,67,.45)}@media (prefers-reduced-motion:reduce){.cc{transition:none}.cc:hover{transform:none}}
.cc .top{padding:16px 18px;color:#fff;min-height:116px;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--c),var(--d))}.cc .top::after{content:"";position:absolute;right:-24px;top:-24px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.18)}.cc .top b{font-size:20px;font-weight:400;display:block}
.cc .bot{padding:12px 16px;font-size:13px;color:var(--mu);min-height:60px}
h1{font-size:22px;font-weight:400;margin:20px 0 14px}
.alert{padding:12px 16px;border-radius:14px;margin-bottom:14px}.alert.w{background:var(--wnbg);color:var(--wn)}.alert.r{background:var(--rdbg);color:var(--rd)}
h3{font-size:14px;color:var(--mu);font-weight:500;margin:18px 0 4px}
.row{display:flex;gap:14px;padding:14px 16px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:8px}.box .row{border:0;border-top:1px solid var(--ln);border-radius:0;margin:0;padding:12px 4px;background:none}
.row.done .tt{text-decoration:line-through;color:var(--mu)}
.row input{width:18px;height:18px;margin-top:3px;accent-color:var(--ac)}
.tt{font-weight:500;display:block}.sub{font-size:13px;color:var(--mu);display:block}
.badge{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acbg);color:var(--ac);margin-left:6px;font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.flash{animation:fl 1.4s}
@keyframes fl{from{background:var(--acbg)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--ac)}}
.foot{font-size:12px;color:var(--mu);margin-top:24px}
@media (max-width:820px){.layout{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);min-height:0;padding:4px}.si{width:auto;white-space:nowrap;border-radius:20px;padding:0 14px;height:40px}.sh{display:none}.two{grid-template-columns:1fr}.banner h2{font-size:26px}}
h1,.banner h2,.banner p{font-family:Outfit,Roboto,system-ui,sans-serif}
h1{font-weight:600;font-size:26px}
.banner::before,.banner::after{display:none}
.art{position:absolute;right:28px;top:22px;width:230px;height:180px}
.art svg{width:100%;height:100%;display:block}
.banner .art{filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.cc .art{right:10px;top:10px;width:104px;height:84px;z-index:1}
.cc .top b{font-family:Outfit,Roboto,sans-serif;font-weight:600}
.pillx{background:var(--acbg);color:var(--ac);padding:3px 10px;border-radius:12px;font-weight:500}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:4px 0 6px}
.day{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 8px;text-align:center;min-height:118px}
.day small{color:var(--mu);display:block}
.day b{font-family:Outfit,Roboto,sans-serif;font-size:20px;font-weight:600}
.day i{display:block;height:10px;border-radius:5px;margin-top:5px}
.day i.f{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px);box-shadow:0 0 0 1.5px rgba(124,77,255,.7)}
.day span{display:block;font-size:11.5px;font-weight:500;margin-top:6px;color:var(--wn)}
.day.hot{background:linear-gradient(180deg,var(--wnbg),var(--sf));border-color:var(--wn)}
.day.today{box-shadow:0 0 0 2px var(--ac)}
.lg{font-size:12.5px;color:var(--mu);margin-bottom:6px}
@media (max-width:820px){.art{width:140px;height:112px;right:12px;top:16px}.cc .art{width:84px;height:68px}.day{padding:8px 2px;min-height:100px}.day i{height:8px}}
.tr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ringbox{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--sf)}
.ring b{position:relative;font-family:Outfit,Roboto,sans-serif;font-size:18px}
.pl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}
.hd,.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hd{margin:10px 0 4px;text-align:center;color:var(--mu);font-size:12px}
.hc{border-radius:10px;padding:6px 4px;min-height:54px;text-align:center;background:rgba(128,128,128,.07);position:relative}
.hc small{display:block;color:var(--mu)}
.hc span{font-weight:500;font-size:12.5px}
.hc em{position:absolute;top:3px;right:5px;font-style:normal;font-size:11px;color:#7c4dff}
.h1{background:rgba(52,168,83,.28)}.h2{background:rgba(251,188,4,.34)}.h3{background:rgba(255,112,67,.36)}.h4{background:rgba(234,67,53,.55)}
.hc.today{box-shadow:0 0 0 2px var(--ac)}
.two2{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-top:14px}
.fld{border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--mu)}
.fld span{display:block;color:var(--tx);font-size:14px}
.bars{display:flex;align-items:flex-end;gap:5px;height:190px;margin-top:12px}
.bar{flex:1;height:100%;border:0;background:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0;font-size:11px;color:var(--mu)}
.bar i{display:block;width:100%;height:var(--h);background:var(--bc);border-radius:6px 6px 0 0}
.bar.on i{outline:2px solid var(--ac);outline-offset:2px}
.bar em{font-style:normal}
.ok2{background:var(--okbg);color:var(--ok);padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
@media (max-width:820px){.tr,.two2{grid-template-columns:1fr}.hc{min-height:44px;padding:4px 1px}}
</style>
</head>
<body>
<div class="demo"><span>Demo controls:</span>
<div class="seg" id="fSeg" role="group" aria-label="Version"><button data-f="0">Classroom today</button><button data-f="1">With Hidden Deadlines</button></div>
<div class="seg" id="rSeg" role="group" aria-label="Role"><button data-r="student">Student</button><button data-r="teacher">Teacher</button></div></div>
<header><span class="mark">🎓</span><div class="crumb" id="crumb"></div><span class="av">M</span></header>
<div class="layout"><nav class="side" id="side" aria-label="Classroom"></nav><main id="app"></main></div>
<script>
const TODAY=new Date(2026,9,26);
const WD=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const fmt=d=>cap(WD[d.getDay()]).slice(0,3)+" "+d.getDate()+" "+cap(MON[d.getMonth()]);
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const CL={dbms:["DBMS","Sem 4 · Div A","Prof. Nair","#1a73e8","#0b3d91","xk3m9aq"],maths:["Maths III","Sem 4 · Div A","Prof. Shah","#e37400","#9a4a00","p7wd2ne"],os:["Operating Systems","Sem 4 · Div A","Prof. Khan","#188038","#0d5224","q4hs8rt"],cn:["Computer Networks","Sem 4 · Div A","Prof. Rao","#a142f4","#5e1fa0","m2vc6yb"],java:["Java","Sem 4 · Div A","Prof. Iyer","#d93025","#8c1a13","h9zl3ku"]};
const POSTS=[
{id:1,c:"cn",t:"Today",text:"Kal tak mini project topic submit karo. One topic per group."},
{id:2,c:"java",t:"Today",text:"Quiz on Thursday, bring your ID cards."},
{id:3,c:"maths",t:"Yesterday",text:"Unit test on 29 Oct covering modules 1 to 3."},
{id:4,c:"dbms",t:"Yesterday",text:"Submit the ER diagram on paper before Friday’s lecture."},
{id:5,c:"os",t:"Sat",text:"Lab manual check hoga 2 Nov ko. Complete all experiments."},
{id:6,c:"cn",t:"Sat",text:"Class on 28 Oct is cancelled. Revision notes are uploaded."},
{id:7,c:"maths",t:"Fri",text:"Notes for Unit 2 are uploaded. Happy reading!"}];
const KEY=/\b(submit|due|deadline|before|by|last date|quiz|test|exam|tak|hoga)\b/i;
function detect(x){
  if(!KEY.test(x))return null;let m;
  if((m=x.match(new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s*("+MON.join("|")+")[a-z]*","i"))))return{date:new Date(2026,MON.indexOf(m[2].toLowerCase()),+m[1]),conf:"High"};
  if((m=x.match(new RegExp("\\b("+WD.join("|")+")\\b","i"))))return{date:addDays(TODAY,(WD.indexOf(m[1].toLowerCase())-TODAY.getDay()+7)%7||7),conf:"High"};
  if(/\b(tomorrow|kal)\b/i.test(x))return{date:addDays(TODAY,1),conf:"Medium"};
  return null;
}
const items=[
{id:"f1",c:"dbms",title:"Lab 5: SQL joins",h:2,date:new Date(2026,9,28),kind:"formal",status:"accepted"},
{id:"f2",c:"maths",title:"Worksheet 4",h:1.5,date:new Date(2026,9,29),kind:"formal",status:"accepted"},
{id:"f3",c:"os",title:"Assignment 2: scheduling",h:3,date:new Date(2026,10,2),kind:"formal",status:"accepted"}];
POSTS.forEach(p=>{const d=detect(p.text);if(d)items.push({id:"p"+p.id,post:p.id,c:p.c,title:p.text.replace(/\.$/,"").slice(0,58),date:d.date,conf:d.conf,kind:"found",status:"pending",h:/quiz|test|exam/i.test(p.text)?2:1});});

const S={sel:3,keep:false,view:"home",cls:"dbms",tab:"stream",tt:"assigned",f:1,role:"student"};
const same=(a,b)=>a.getTime()===b.getTime();
const vis=()=>items.filter(i=>i.kind==="formal"||(S.f&&i.status!=="dismissed"));
const go=(v,c,tab)=>{S.view=v;if(c)S.cls=c;if(tab)S.tab=tab;render();window.scrollTo(0,0);};
const sty=k=>`--c:${CL[k][3]};--d:${CL[k][4]}`;
const HRS=i=>i.h||1;
const tracker=()=>{
 const v=vis(),live=v.filter(i=>!i.done),done=v.length-live.length,pct=v.length?Math.round(done/v.length*100):0;
 let used=0;const plan=live.slice().sort((a,b)=>a.date-b.date).filter(i=>{if(used>=3)return false;used+=HRS(i);return true;});
 const day=k=>{const d=addDays(TODAY,k),its=live.filter(i=>same(i.date,d));return{d,its,h:its.reduce((s,i)=>s+HRS(i),0)};};
 let heavy='';
 if(S.f){for(let k=0;k<28;k++){const x=day(k);if(x.its.length>=3||x.h>=5){const hid=x.its.filter(i=>i.kind==='found').length;heavy+=`<div class='alert w'>${fmt(x.d)} looks heavy: ${x.its.length} deadlines, about ${x.h}h of work${hid?` (${hid} hidden in announcements)`:''}. Starting a day early will help.</div>`;}}}
 else heavy=`<div class='alert r'>This view only counts work filed under Classwork. ${items.filter(i=>i.kind==='found').length} deadlines posted in streams are missing, so the weeks look lighter than they are.</div>`;
 const cells=[...Array(28).keys()].map(k=>{const x=day(k),l=!x.h?0:x.h<=1.5?1:x.h<=3?2:x.h<=5?3:4;return `<div class='hc h${l}${k?'':' today'}' title='${x.its.map(i=>i.title).join(', ')}'><small>${x.d.getDate()}</small><span>${x.h?x.h+'h':''}</span>${x.its.some(i=>i.kind==='found')?'<em>✦</em>':''}</div>`;}).join('');
 const nf=items.filter(i=>i.kind==='found'&&i.status!=='dismissed').length;
 return `<div class='tr'><div class='box ringbox'><div class='ring' style='--p:${pct}'><b>${done}/${v.length}</b></div><div><div class='name'>Good evening</div><div class='meta'>${live.length} more to go.${S.f?` ${nf} were found in announcements.`:''}</div></div></div><div class='box'><h4>Tonight’s plan</h4>${plan.map(i=>`<div class='pl'><span><span class='dot' style='background:${CL[i.c][3]}'></span> ${i.title.slice(0,32)}</span><b>${HRS(i)}h</b></div>`).join('')||`<div class='meta'>All clear.</div>`}<div class='meta'>About ${used}h, a realistic session.</div></div></div>${heavy}<div class='box'><h4>The next four weeks</h4><div class='meta'>Darker days mean more hours of work landing at once. Hours are estimates.${S.f?' ✦ marks days with hidden deadlines.':''}</div><div class='hd'>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<small>${x}</small>`).join('')}</div><div class='heat'>${cells}</div></div>`;
};
const PCT=[20,35,45,95,60,5,0,25,40,15,70,30,10,0];
const sched=()=>{
 const sel=S.sel,p=PCT[sel],d=addDays(TODAY,sel);
 let alt=-1,best=101;PCT.forEach((v,k)=>{if(k>=1&&k<7&&k!==sel&&v<best&&addDays(TODAY,k).getDay()%6){best=v;alt=k;}});
 const bars=PCT.map((v,k)=>{const dd=addDays(TODAY,k);return `<button class='bar${k===sel?' on':''}' data-day='${k}' style='--h:${Math.max(3,Math.round(v*1.3))}px;--bc:${v>=60?'#ea4335':v>=30?'#fbbc04':'#34a853'}' aria-label='${fmt(dd)}: ${v}%'><i></i><small>${cap(WD[dd.getDay()])[0]}</small><em>${dd.getDate()}</em></button>`;}).join('');
 const msg=(S.keep||p<50)?`<div class='ok2'><b>${p<50?'Looks good.':'Keeping '+fmt(d)+'.'}</b> ${p<50?`Only ${p}% of students have 2+ deadlines that day.`:`${p}% of students will have a busy day, and their trackers will show a crunch-day warning so they can plan ahead.`}</div>`:`<div class='nudge'><b>${p}% of your students already have 2 or more deadlines on ${fmt(d)}.</b> ${fmt(addDays(TODAY,alt))} is calmer (${best}%). Want to move it?<div class='acts'><button class='btn pri' data-act='use' data-alt='${alt}'>Use ${fmt(addDays(TODAY,alt))}</button><button class='btn' data-act='keep'>Keep ${fmt(d)}</button></div></div>`;
 return `<h1>Schedule work</h1><div class='meta'>A small heads-up when a due date lands on a day your students are already stretched.</div><div class='two2'><div class='box'><h4>New assignment</h4><div class='fld'>Class<span>DBMS (Prof. Nair)</span></div><div class='fld'>Title<span>e.g. Normalisation worksheet</span></div><div class='fld'>Due date<span>${fmt(d)}</span></div>${msg}<div class='acts'><button class='btn pri' disabled>Assign to 62 students</button></div><div class='meta' style='margin-top:10px'>Teachers see only counts like these, never an individual student’s workload.</div></div><div class='box'><h4>How busy are your students?</h4><div class='meta'>Share of students with 2 or more other deadlines. Tap a bar to try that day. Fictional demo data.</div><div class='bars'>${bars}</div></div></div>`;
};
const ART={
dbms:`<svg viewBox='0 0 200 160'><g fill='#fff'><ellipse cx='100' cy='40' rx='50' ry='17'/><path fill-opacity='.75' d='M50 46v30c0 10 22 17 50 17s50-7 50-17V46c0 10-22 17-50 17S50 56 50 46z'/><path fill-opacity='.5' d='M50 82v30c0 10 22 17 50 17s50-7 50-17V82c0 10-22 17-50 17S50 92 50 82z'/></g></svg>`,
maths:`<svg viewBox='0 0 200 160'><g fill='none' stroke='#fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'><circle cx='62' cy='92' r='40' stroke-opacity='.85'/><path d='M104 140L152 34l44 106z' stroke-opacity='.9'/></g><text x='38' y='112' font-size='62' fill='#fff' font-family='Outfit,serif'>π</text></svg>`,
os:`<svg viewBox='0 0 200 160'><circle cx='100' cy='80' r='50' fill='none' stroke='#fff' stroke-width='16' stroke-dasharray='11 9' stroke-opacity='.85'/><circle cx='100' cy='80' r='34' fill='#fff'/><circle cx='100' cy='80' r='14' style='fill:var(--c)'/></svg>`,
cn:`<svg viewBox='0 0 200 160'><g stroke='#fff' stroke-width='4' stroke-opacity='.8'><path d='M100 80L40 36M100 80L164 44M100 80L52 132M100 80L158 124'/></g><g fill='#fff'><circle cx='100' cy='80' r='20'/><circle cx='40' cy='36' r='12'/><circle cx='164' cy='44' r='13'/><circle cx='52' cy='132' r='11'/><circle cx='158' cy='124' r='14'/></g></svg>`,
java:`<svg viewBox='0 0 200 160'><g fill='#fff'><path d='M52 64h96v34c0 26-20 42-48 42s-48-16-48-42z'/></g><path d='M148 74h14c14 0 14 28 0 28h-14' fill='none' stroke='#fff' stroke-width='9'/><g fill='none' stroke='#fff' stroke-width='6' stroke-linecap='round' stroke-opacity='.85'><path d='M82 48c-10-12 10-18 0-30M112 48c-10-12 10-18 0-30'/></g></svg>`};
const strip=()=>{const live=vis().filter(i=>!i.done);return `<div class='lg'>This week at a glance${S.f?' · striped bars were found in announcements':''}</div><div class='strip'>`+[0,1,2,3,4,5,6].map(k=>{const d=addDays(TODAY,k),its=live.filter(i=>same(i.date,d));return `<div class='day${its.length>=3?' hot':''}${k?'':' today'}'><small>${cap(WD[d.getDay()]).slice(0,3)}</small><b>${d.getDate()}</b>${its.map(i=>`<i class='${i.kind==='found'?'f':''}' style='background-color:${CL[i.c][3]}' title='${CL[i.c][0]}'></i>`).join('')}<span>${its.length>=3?'Heavy day':''}</span></div>`;}).join('')+`</div>`;};

function postHtml(p){
  const it=items.find(i=>i.post===p.id);let x="";
  if(it&&S.f){
    x+=it.kind==="found"?`<span class="chip">✦ Deadline found: ${fmt(it.date)}</span>`:`<span class="chip ok">Added to Classwork</span>`;
    if(S.role==="teacher"&&it.kind==="found"){
      const n=vis().filter(o=>o!==it&&!o.done&&same(o.date,it.date)).length;
      x+=`<div class="nudge"><b>This looks like a deadline.</b> Add it to Classwork so it shows in every student’s to-do list? ${n?`Students already have ${n} other deadline${n>1?"s":""} on ${fmt(it.date)}. Consider another day.`:`No other deadlines on ${fmt(it.date)}.`}<div class="acts"><button class="btn pri" data-act="file" data-id="${it.id}">Add to Classwork</button></div></div>`;
    }
  }
  return `<article class="box post" id="post-${p.id}"><span class="ph" style="--c:${CL[p.c][3]}">${CL[p.c][2][6]}</span><div><div class="name">${CL[p.c][2]}</div><div class="meta">${p.t}</div><p>${p.text}</p>${x}</div></article>`;
}
const row=(i,pend)=>`<div class="row${i.done?" done":""}"><input type="checkbox" aria-label="Mark done" data-act="done" data-id="${i.id}" ${i.done?"checked":""}><div><span class="tt">${i.title}${i.kind==="found"&&i.status==="accepted"?'<span class="badge">From stream</span>':""}</span><span class="sub"><span class="dot" style="background:${CL[i.c][3]}"></span> ${CL[i.c][0]} · Due ${fmt(i.date)}${pend?` · ${i.conf} confidence`:""}</span>${pend?`<div class="acts"><button class="btn pri" data-act="accept" data-id="${i.id}">Add to my list</button><button class="btn" data-act="dismiss" data-id="${i.id}">Not a deadline</button><button class="btn" data-act="jump" data-id="${i.id}">See post</button></div>`:""}</div></div>`;

function home(){
  return `<h1>Classes</h1><div class="cards">`+Object.keys(CL).map(k=>{
    const n=vis().filter(i=>i.c===k&&!i.done).length;
    return `<button class="cc" data-go="class" data-c="${k}"><div class="top" style="${sty(k)}"><div class="art">${ART[k]}</div><b>${CL[k][0]}</b>${CL[k][1]}<br>${CL[k][2]}</div><div class="bot">${n?`<span class="pillx">${n} due soon</span>`:"No work due soon"}</div></button>`;}).join("")+`</div>`;
}
function klass(){
  const c=S.cls,mine=vis().filter(i=>i.c===c&&!i.done).sort((a,b)=>a.date-b.date);
  const up=mine.slice(0,2).map(i=>`<div class="it">${fmt(i.date)}<br>${i.title.slice(0,30)}</div>`).join("")||"No work due soon";
  const posts=POSTS.filter(p=>p.c===c).map(postHtml).join("");
  const work=vis().filter(i=>i.c===c&&i.kind==="formal").sort((a,b)=>a.date-b.date).map(i=>`<div class="box post"><span class="ph sq">📄</span><div><div class="name">${CL[c][2]} posted a new assignment: ${i.title}</div><div class="meta">Due ${fmt(i.date)}</div></div></div>`).join("")||`<div class="meta">No assignments yet.</div>`;
  return `<div class="tabs"><button data-tab="stream" aria-current="${S.tab==="stream"}">Stream</button><button data-tab="work" aria-current="${S.tab==="work"}">Classwork</button><button disabled>People</button><button disabled>Grades</button></div>
  <div class="banner" style="${sty(c)}"><div class="art">${ART[c]}</div><h2>${CL[c][0]}</h2><p>${CL[c][1]}</p></div>
  ${S.tab==="stream"?`<div class="two"><div><div class="box"><h4>Class code</h4><div class="code">${CL[c][5]}</div></div><div class="box"><h4>Upcoming</h4><div class="up">${up}</div><button class="link" data-go="todo">View all</button><div style="clear:both"></div></div></div><div><div class="box ann"><span class="ph">M</span>Announce something to your class</div>${posts||'<div class="meta">No posts yet.</div>'}</div></div>`:`<div style="margin-top:20px">${work}</div>`}`;
}
function todo(){
  const v=vis(),live=v.filter(i=>!i.done);let a="";
  if(!S.f){const h=items.filter(i=>i.kind==="found").length;a=`<div class="alert r">Only work filed under Classwork appears here. ${h} deadlines posted in class streams are missing.</div>`;}
  else{const g={};live.forEach(i=>(g[i.date.getTime()]=g[i.date.getTime()]||[]).push(i));
    Object.values(g).filter(x=>x.length>=3).forEach(x=>{const h=x.filter(i=>i.kind==="found").length;a+=`<div class="alert w">${fmt(x[0].date)} has ${x.length} deadlines${h?`, ${h} of them hidden in announcements`:""}.</div>`;});}
  let body="";
  if(S.tt==="assigned"){
    const pend=S.f?items.filter(i=>i.kind==="found"&&i.status==="pending"):[];
    if(pend.length)body+=`<h3>Found in announcements</h3><div class="box">Posted in the stream, not in Classwork. Review each one.${pend.map(i=>row(i,1)).join("")}</div>`;
    const list=live.filter(i=>!(i.kind==="found"&&i.status==="pending")).sort((a,b)=>a.date-b.date);
    [["This week",0,6],["Next week",7,13],["Later",14,999]].forEach(([n,lo,hi])=>{
      const r=list.filter(i=>{const d=Math.round((i.date-TODAY)/864e5);return d>=lo&&d<=hi;});
      if(r.length)body+=`<h3>${n}</h3>${r.map(i=>row(i)).join("")}`;});
    if(!body)body=`<div class="meta">Nothing assigned.</div>`;
  }else if(S.tt==="missing")body=`<div class="meta">No missing work.</div>`;
  else body=v.filter(i=>i.done).map(i=>row(i)).join("")||`<div class="meta">Nothing marked done yet.</div>`;
  return `<div class="tabs">${["assigned","missing","done"].map(t=>`<button data-tt="${t}" aria-current="${S.tt===t}">${cap(t)}</button>`).join("")}</div>${S.f?'':a}${S.tt==="assigned"?tracker():""}${body}`;
}
function render(){
  document.querySelectorAll("#fSeg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.f===S.f));
  document.querySelectorAll("#rSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===S.role));
  document.getElementById("crumb").innerHTML=`Classroom`+(S.view==="class"?` <span>›</span> <span><b>${CL[S.cls][0]}</b><small>${CL[S.cls][1]}</small></span>`:S.view==="todo"?` <span>›</span> <b>My Tracker</b>`:S.view==="sched"?` <span>›</span> <b>Schedule work</b>`:"");
  const cur=v=>S.view===v?' aria-current="page"':"";
  document.getElementById("side").innerHTML=`<button class="si" data-go="home"${cur("home")}>🏠 Home</button><button class="si" aria-disabled="true" title="Not part of this demo">📅 Calendar</button><button class="si" data-go="todo"${cur("todo")}>📊 My Tracker</button>${S.role==="teacher"?`<button class="si" data-go="sched"${cur("sched")}>🗓️ Schedule work</button>`:""}<div class="sh">Enrolled</div>`+Object.keys(CL).map(k=>`<button class="si" data-go="class" data-c="${k}"${S.view==="class"&&S.cls===k?' aria-current="page"':""}><span class="c" style="background:${CL[k][3]}">${CL[k][0][0]}</span>${CL[k][0]}</button>`).join("");
  document.getElementById("app").innerHTML=(S.view==="home"?home():S.view==="class"?klass():S.view==="sched"?sched():todo())+`<p class="foot">Fictional classes and posts. A look-alike built from scratch for a hackathon, not Google’s code, and not affiliated with Google. Detection here uses simple rules in the browser; the full build swaps in an AI model. Today in this demo is Monday 26 Oct 2026.</p>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-f],[data-r],[data-go],[data-tab],[data-tt],[data-act],[data-day]");if(!b)return;
  const d=b.dataset;if(d.day!==undefined){S.sel=+d.day;S.keep=false;return render();}if(d.act==="use"){S.sel=+d.alt;S.keep=false;return render();}if(d.act==="keep"){S.keep=true;return render();}
  if(d.f!==undefined){S.f=+d.f;return render();}
  if(d.r){S.role=d.r;if(d.r==="student"&&S.view==="sched")S.view="todo";return render();}
  if(d.go)return go(d.go,d.c,"stream");
  if(d.tab){S.tab=d.tab;return render();}
  if(d.tt){S.tt=d.tt;return render();}
  const it=items.find(i=>i.id===d.id);
  if(d.act==="jump"){go("class",it.c,"stream");const el=document.getElementById("post-"+it.post);el.scrollIntoView({block:"center"});el.classList.add("flash");return;}
  if(d.act==="done")it.done=b.checked;
  if(d.act==="accept")it.status="accepted";
  if(d.act==="dismiss")it.status="dismissed";
  if(d.act==="file"){it.kind="formal";it.status="accepted";}
  render();
});
render();
</script>
</body>
